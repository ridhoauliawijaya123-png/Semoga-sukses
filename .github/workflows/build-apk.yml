name: Build APK Teknisi

on:
  push:
    branches: [main]
    paths: ['teknisi/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek Android dari folder teknisi
        run: |
          mkdir apk
          cp -r teknisi apk/www
          cd apk
          echo '{"name":"teknisi-lapangan","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"6.2.0","@capacitor/core":"6.2.0"},"devDependencies":{"@capacitor/cli":"6.2.0"}}' > package.json
          echo '{"appId":"id.teknisi.lapangan","appName":"Teknisi Lapangan","webDir":"www"}' > capacitor.config.json
          npm install
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          grep -q "android.permission.CAMERA" "$M"

      - name: Kunci tanda tangan APK (tetap sama tiap build)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/teknisi-lapangan.apk"

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Teknisi build ${{ github.run_number }}
          body: Unduh teknisi-lapangan.apk lalu instal di HP Android.
          files: teknisi-lapangan.apk
